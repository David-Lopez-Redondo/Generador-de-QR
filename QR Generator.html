<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de QR Neón</title>
<style>
  :root {
    --bg: #070b1a;
    --panel: #0f172a;
    --input: #111c33;
    --text: #f8fafc;
    --muted: #94a3b8;
    --cyan: #22d3ee;
    --magenta: #e879f9;
    --red: #fb7185;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 15% 10%, rgba(34,211,238,.12), transparent 60%),
      radial-gradient(900px 500px at 85% 90%, rgba(232,121,249,.12), transparent 60%),
      var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 480px;
    background: linear-gradient(180deg, rgba(15,23,42,.95), rgba(10,14,30,.95));
    border: 1px solid rgba(34,211,238,.45);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 0 22px rgba(34,211,238,.25), 0 0 60px rgba(232,121,249,.15), inset 0 0 30px rgba(34,211,238,.05);
    text-align: center;
  }
  h1 {
    margin: 0 0 20px; font-size: 1.6rem; letter-spacing: .5px;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(34,211,238,.9), 0 0 24px rgba(34,211,238,.5);
  }
  h1 span { color: var(--magenta); text-shadow: 0 0 8px rgba(232,121,249,.9), 0 0 24px rgba(232,121,249,.5); }
  input[type=text] {
    width: 100%; padding: 14px 16px; font-size: 1rem;
    color: var(--text); background: var(--input);
    border: 1px solid rgba(148,163,184,.3); border-radius: 12px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(34,211,238,.15), 0 0 16px rgba(34,211,238,.45);
  }
  input.error { border-color: var(--red); box-shadow: 0 0 14px rgba(251,113,133,.5); }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; cursor: pointer; font: inherit; font-weight: 600;
    padding: 12px 16px; border-radius: 12px; color: var(--text);
    background: transparent; border: 1px solid; transition: transform .15s, box-shadow .2s, background .2s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .primary { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,.1); box-shadow: 0 0 12px rgba(34,211,238,.35); }
  .primary:hover:not(:disabled) { background: rgba(34,211,238,.22); box-shadow: 0 0 22px rgba(34,211,238,.7); }
  .download { border-color: var(--magenta); color: var(--magenta); background: rgba(232,121,249,.1); box-shadow: 0 0 12px rgba(232,121,249,.35); }
  .download:hover:not(:disabled) { background: rgba(232,121,249,.22); box-shadow: 0 0 22px rgba(232,121,249,.7); }
  .ghost { border-color: rgba(148,163,184,.4); color: var(--muted); font-weight: 500; font-size: .9rem; padding: 9px 14px; }
  .ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  .qr-wrap {
    margin: 22px auto 8px; padding: 14px; width: fit-content; max-width: 100%;
    background: #fff; border-radius: 16px;
    box-shadow: 0 0 0 2px var(--cyan), 0 0 22px rgba(34,211,238,.7), 0 0 50px rgba(232,121,249,.4);
    animation: pulse 3.5s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { box-shadow: 0 0 0 2px var(--magenta), 0 0 26px rgba(232,121,249,.8), 0 0 55px rgba(34,211,238,.4); }
  }
  @media (prefers-reduced-motion: reduce) { .qr-wrap { animation: none; } }
  canvas { display: block; width: min(300px, 70vw); height: auto; aspect-ratio: 1; }
  .placeholder { color: var(--muted); padding: 40px 0; }
  #actual {
    margin: 14px 0 0; font-size: .85rem; color: var(--muted);
    word-break: break-all; min-height: 1.2em;
  }
  #msg { min-height: 1.2em; margin: 8px 0 0; font-size: .85rem; color: var(--red); }
  .hint { margin-top: 14px; font-size: .75rem; color: #64748b; }
  .controls { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
  .controls button { flex: 0 1 auto; }
  :fullscreen body, body:fullscreen { background: var(--bg); }
</style>
</head>
<body>
  <main class="card">
    <h1>Generador de <span>QR</span> Dinámico</h1>

    <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="Pega aquí tu enlace…" value="https://www.google.com/?hl=es" aria-label="Enlace para el código QR">
    <p id="msg" role="alert"></p>

    <div class="row">
      <button id="btnGen" class="primary">Generar Código QR</button>
      <button id="btnDown" class="download" disabled>Descargar JPG</button>
    </div>

    <div class="qr-wrap"><canvas id="qr" width="300" height="300" aria-label="Código QR generado"></canvas></div>
    <p id="actual"></p>

    <div class="controls">
      <button id="btnFull" class="ghost">Pantalla completa (F11 / Esc)</button>
    </div>
    <p class="hint">El QR se actualiza automáticamente mientras escribes · Enter para generar</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const input = $('url'), canvas = $('qr'), ctx = canvas.getContext('2d');
    const btnDown = $('btnDown'), msg = $('msg'), actual = $('actual');
    let currentUrl = '';

    function setError(text) {
      msg.textContent = text || '';
      input.classList.toggle('error', !!text);
    }

    // Dibuja el QR con borde de 4 módulos y alta corrección de errores (H)
    function crearQR() {
      const url = input.value.trim();
      if (!url) { setError(''); return; }
      if (typeof qrcode === 'undefined') {
        setError('No se pudo cargar la librería QR. Comprueba tu conexión a internet.');
        return;
      }
      try {
        const qr = qrcode(0, 'H');
        qr.addData(url);
        qr.make();

        const n = qr.getModuleCount(), border = 4, total = n + border * 2;
        const cell = Math.max(4, Math.floor(1000 / total)); // resolución alta para la descarga
        const size = cell * total;
        canvas.width = canvas.height = size;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#1E1E1E';
        for (let r = 0; r < n; r++)
          for (let c = 0; c < n; c++)
            if (qr.isDark(r, c)) ctx.fillRect((c + border) * cell, (r + border) * cell, cell, cell);

        currentUrl = url;
        actual.textContent = 'Enlace actual: ' + url;
        btnDown.disabled = false;
        setError('');
      } catch (e) {
        setError('El texto es demasiado largo para un código QR.');
        btnDown.disabled = true;
      }
    }

    function descargarJPG() {
      if (!currentUrl) return;
      let nombre = 'codigo_qr';
      try { nombre = 'qr_' + new URL(currentUrl).hostname.replace(/[^a-z0-9.-]/gi, '_'); } catch (_) {}
      canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = nombre + '.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }, 'image/jpeg', 0.95);
    }

    function alternarPantallaCompleta() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    }

    let t;
    input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(crearQR, 350); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(t); crearQR(); } });
    $('btnGen').addEventListener('click', crearQR);
    btnDown.addEventListener('click', descargarJPG);
    $('btnFull').addEventListener('click', alternarPantallaCompleta);
    document.addEventListener('keydown', e => {
      if (e.key === 'F11') { e.preventDefault(); alternarPantallaCompleta(); }
    });

    crearQR(); // QR inicial con el valor por defecto
  </script>
</body>
</html>
